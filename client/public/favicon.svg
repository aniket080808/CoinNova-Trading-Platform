<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cn-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Gradient Badge -->
  <rect width="100" height="100" rx="24" fill="url(#cn-bg)" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none" />

  <!-- Orbital Currency Arc / Letter C -->
  <path d="M 50 18 A 32 32 0 1 0 82 50" stroke="url(#cn-white)" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.95" filter="url(#shadow)" />
  <circle cx="82" cy="50" r="4.5" fill="#ffffff" />

  <!-- Central Nova Starburst -->
  <path d="M 50 28 L 54.5 44 L 70 47 L 55.5 53.5 L 50 72 L 44.5 53.5 L 29 47 L 44.5 44 Z" fill="url(#cn-white)" filter="url(#shadow)" />

  <!-- Nova Core Center -->
  <circle cx="50" cy="48.5" r="3.5" fill="#090d16" />
  <circle cx="50" cy="48.5" r="2" fill="#10b981" />
</svg>
